; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = slave

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

[env:master]
build_src_filter = +<master/*>

[env:slave]
build_src_filter = +<slave/*> +<modules/*>
board = nanoatmega328

[env:accel_test]
build_src_filter = +<module-tests/accel/*> +<modules/*>
board = nanoatmega328

[env:accel_test_uno]
build_src_filter = +<module-tests/accel/*> +<modules/accel_ny.cpp>
board = uno
lib_deps =
  electroniccats/MPU6050 @ ^1.4.1

[env:current_test]
build_src_filter = +<module-tests/current/*> +<modules/*>
board = nanoatmega328

[env:gps_test]
build_src_filter = +<module-tests/gps/*> +<modules/*>
board = nanoatmega328

[env:voltage_test]
build_src_filter = +<module-tests/voltage/*> +<modules/*>
board = nanoatmega328
